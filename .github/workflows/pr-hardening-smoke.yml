name: PR hardening smoke tests

on:
  push:
    branches:
      - audit/2026-10-19-small-hardening
  pull_request:
    branches:
      - main
    paths:
      - "installer/aufspielen.py"
      - "einrichtungshelfer/**"
      - "test_release_hardening.py"
      - "test_repository_model_parts.py"
      - ".github/workflows/pr-hardening-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile modified Python modules
        run: python -m compileall -q einrichtungshelfer installer test_release_hardening.py test_repository_model_parts.py
      - name: Run offline tests and verify both real Funke models
        run: python -m unittest -v test_release_hardening test_repository_model_parts
